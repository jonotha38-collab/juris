name: Juris checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  process-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Check JavaScript syntax
        run: node --check core/engine.mjs && node --check core/clients.mjs && node --check core/collaboration.mjs && node --check public/juris.js && node --check public/import-ui.mjs && node --check core/pending.mjs && node --check public/pending-ui.mjs && node --check public/collaboration-ui.mjs
      - name: Test imports, pending work, dates and access permissions
        run: node --test tests/*.test.mjs
