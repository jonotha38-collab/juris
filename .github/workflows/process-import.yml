name: Process import checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  process-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: node --check core/engine.mjs && node --check core/clients.mjs && node --check core/collaboration.mjs && node --check public/juris.js && node --check public/import-ui.mjs
      - name: Test case imports and access permissions
        run: node --test tests/*.test.mjs
